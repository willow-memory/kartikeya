name: Release Please

# Keeps an open "chore: release X.Y.Z" pull request that accumulates every merge
# to master — bumping the proposed version from conventional-commit prefixes and
# writing the CHANGELOG entry. Nothing publishes while it sits there. It arms
# auto-merge on itself, so when CI goes green it merges, the tag is created, and
# the tag push fires `release.yml`.
#
# Releasing here used to mean tagging by hand, and v0.0.8 is what that cost: the
# tag was cut on a commit whose version was still 0.0.7, the build produced
# 0.0.7, and nothing noticed until PyPI refused the duplicate. 0.0.8 is still
# missing from PyPI. release.yml grew an assertion for that afterwards; this
# removes the step where a human has to get the number right at all, because the
# version is derived from the tag release-please creates.
#
# WHY THE PAT, in both places below — the lesson jeles paid three releases to
# learn, and it fails silently every time:
#
#   1. GitHub suppresses workflow runs for any event generated with
#      GITHUB_TOKEN. Not just `push: tags` — `release: published` too. jeles
#      v0.2.0: tagged, released, absent from PyPI.
#   2. Calling release.yml via `workflow_call` does start it, but then PyPI
#      authenticates against `job_workflow_ref` (the callee) while the PEP 740
#      attestation records `workflow_ref` (the caller) — they disagree by
#      construction. jeles v0.2.1 and v0.3.0: built fine, rejected at upload.
#      (Moot here for now: this repo publishes with an API token and sets
#      `attestations: false`. It stops being moot the day it moves to OIDC.)
#   3. A PAT is not a bot token, so the tag it pushes triggers workflows
#      normally.
#
#   The same applies to arming auto-merge: GitHub attributes an auto-merge to
#   whoever armed it, so armed with GITHUB_TOKEN the release PR would merge and
#   this workflow would never run again to cut the tag.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel a run that may be cutting a release

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the release PAT
        # Without this, a missing secret degrades to GITHUB_TOKEN and still
        # opens a healthy-looking release PR whose tag starts no workflow — so
        # everything reads as fine right up until nothing reaches PyPI.
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is not set on this repository."
            cat <<'MSG'
          Add a fine-grained PAT scoped to this repo with:
            Contents: read/write
            Pull requests: read/write
          as the repository secret RELEASE_PLEASE_TOKEN.
          MSG
            exit 1
          fi
          echo "RELEASE_PLEASE_TOKEN present"

      # Needed by the changelog step below, which derives entries from
      # `git log <previous tag>..<this release>` rather than trusting the
      # generated text. `fetch-depth: 0` plus tags is load-bearing — a shallow
      # clone cannot see either end of that range, and the tool would then
      # silently compute a different set.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # The PAT, not the default GITHUB_TOKEN — and this is about the *push*
          # in the changelog step below, not about reading.
          #
          # checkout persists whatever credential it used, and `git push` then
          # uses it. `env: GH_TOKEN` only reaches the `gh` CLI. With the default,
          # the commit was pushed as github-actions[bot], so the release PR's CI
          # run came back `action_required` — created but held awaiting manual
          # approval — and auto-merge sat waiting on a check that would never
          # report. Observed on the 2.2.0 release PR, which needed CI started by
          # hand. release-please's own commit on the same branch was not gated,
          # because it pushes with this token.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Correct the section release-please just wrote, before auto-merge is
      # armed below. This fleet merges with merge commits, so GitHub writes the
      # PR title into the merge commit body and release-please counts one change
      # twice — willow-mcp shipped 2.1.2, 2.1.3 and 2.1.4 that way, and 2.1.3
      # lost a real commit to the merge commit that displaced it.
      #
      # NOTE, because it changes how far to trust this step: it has never run
      # here. This repo has no CHANGELOG.md and no release-please release commit
      # anywhere in its history, so the tool no-ops ("nothing to rebuild") until
      # release-please actually cuts a release. Installed ahead of the problem,
      # not in response to one.
      - name: Rebuild the changelog section from the commits
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch=$(gh pr list --repo "$REPO" --state open --json number,headRefName \
                     --jq '[.[] | select(.headRefName | startswith("release-please--"))]
                           | first | .headRefName // empty')
          if [ -z "$branch" ]; then
            echo "No open release PR — nothing releasable, nothing to correct."
            exit 0
          fi

          git fetch --tags origin "$branch"
          git checkout "$branch"

          # Exit 2 means the tool found something it does not model — a breaking
          # change, an unreadable range. Warn and carry on rather than fail:
          # failing here fails the job, so the auto-merge arming below never runs
          # and the release simply does not ship. willow-mcp shipped that bug and
          # its first real run broke the release job; the correction travels with
          # the port rather than being rediscovered here.
          set +e
          python tools/changelog_dedup.py
          status=$?
          set -e
          if [ "$status" = "2" ]; then
            echo "::warning::changelog_dedup could not rebuild this section — "\
                 "release-please's version is shipping as-is. Check it by hand."
            exit 0
          fi
          [ "$status" = "0" ] || exit "$status"

          if git diff --quiet -- CHANGELOG.md; then
            echo "release-please's section already matches the commits."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: rebuild the changelog section from the commits

          release-please parsed the merge commits alongside the commits they
          merge, because this repo does not squash-merge. See
          tools/changelog_dedup.py."
          git push origin "$branch"

      # The GitHub Release body is generated by release-please from its OWN
      # parse, not from CHANGELOG.md — so correcting the file leaves the release
      # page still wrong. willow-mcp's v2.1.4 page and jeles' v0.5.0 page both
      # kept their duplicate after the file had been corrected.
      #
      # As with the step above: this has never run here, and cannot yet. There
      # is no CHANGELOG.md and no release-please release commit in this repo's
      # history, so `--print-section` exits 2 and this step warns and leaves the
      # release alone. Installed ahead of the problem.
      #
      # There is no repository setting that avoids the underlying problem. The
      # merge-commit title/message combinations GitHub accepts are exactly
      # PR_TITLE+PR_BODY, PR_TITLE+BLANK and MERGE_MESSAGE+PR_TITLE; all three
      # put the PR title somewhere release-please parses, and release-please has
      # no option to skip merge commits (its only filter, `exclude-paths`, works
      # on file paths — useless for a merge commit, whose file set is the union
      # of what it merges). This step and the one above are the fix.
      - name: Make the GitHub Release body match the changelog
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The step above may have left the tree on the release PR branch.
          # Read the pushed commit, always.
          git checkout --quiet "$GITHUB_SHA"

          version=$(python -c "import json;print(json.load(open('.release-please-manifest.json'))['.'])")
          tag="v${version}"

          if ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "No release $tag yet — nothing to sync (this run did not cut one)."
            exit 0
          fi

          want=$(mktemp)
          if ! python tools/changelog_dedup.py --print-section "$version" > "$want"; then
            echo "::warning::no changelog section for ${version} — leaving the "\
                 "release body as release-please wrote it."
            exit 0
          fi
          if [ ! -s "$want" ]; then
            echo "::warning::empty changelog section for ${version} — leaving the "\
                 "release body alone rather than blanking it."
            exit 0
          fi

          have=$(mktemp)
          gh release view "$tag" --repo "$REPO" --json body --jq .body > "$have"

          # Compare on content, not trailing whitespace. GitHub returns the body
          # without a final newline while the extracted section has one, and a
          # plain `diff` calls that a difference — which would rewrite the
          # release on every push to master forever.
          if python - "$want" "$have" <<'PY'
          import sys
          a, b = (open(p).read().rstrip() for p in sys.argv[1:3])
          sys.exit(0 if a == b else 1)
          PY
          then
            echo "Release $tag already matches CHANGELOG.md."
            exit 0
          fi

          echo "Release $tag disagrees with CHANGELOG.md — updating it."
          diff "$have" "$want" || true
          gh release edit "$tag" --repo "$REPO" --notes-file "$want"

      - name: Arm auto-merge on the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --state open --json number,headRefName \
                 --jq '[.[] | select(.headRefName | startswith("release-please--"))]
                       | first | .number // empty')
          if [ -z "$pr" ]; then
            echo "No open release PR — nothing releasable since the last tag."
            exit 0
          fi

          echo "Arming auto-merge on release PR #${pr}"
          if gh pr merge --auto --merge "$pr" --repo "$REPO"; then
            exit 0
          fi

          # No fallback to a direct merge. `--auto` is what makes the merge wait
          # for CI; merging here would publish off an unverified commit, and a
          # PyPI version can never be reused or replaced.
          cat <<'MSG'
          ::error::Could not arm auto-merge on the release PR.

          Both must hold, and GitHub declines quietly otherwise:
            1. Settings -> General -> "Allow auto-merge" is enabled.
            2. master's branch protection requires at least one status check.
               This repo's checks are named `test (3.11)` / `test (3.12)` /
               `test (3.13)` — it has no separate aggregate job, unlike jeles
               and willow-mcp. With nothing required there is nothing for
               auto-merge to wait on, so GitHub will not arm it at all.

          Releases still work — the PR is there to merge by hand.
          MSG
          exit 1
