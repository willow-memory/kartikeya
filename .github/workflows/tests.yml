name: Tests

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      # One broken leg must not hide the others: the whole point of a version
      # matrix is seeing which versions fail, not just that one did.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Install
        # pyyaml is for tests/test_release_wiring.py, which reads the release
        # workflows. That file importorskips on it, so leaving it out would turn
        # every release-chain check into a silent skip — the exact failure mode
        # they exist to catch. There is no dev extra in this repo to put it in.
        run: pip install -e "." pytest pyyaml

      - name: Run tests
        run: python -m pytest tests/ -q

  # Aggregate gate: branch protection requires a single check named exactly
  # "test" across the whole fleet, so the ruleset never has to name a matrix
  # cell. Pinning a cell name means the required check silently stops
  # reporting the moment the matrix is re-shaped. Green only when every leg is.
  test:
    needs: [test-matrix]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all matrix legs green"
