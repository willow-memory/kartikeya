name: Tests

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Install
        # pyyaml is for tests/test_release_wiring.py, which reads the release
        # workflows. That file importorskips on it, so leaving it out would turn
        # every release-chain check into a silent skip — the exact failure mode
        # they exist to catch. There is no dev extra in this repo to put it in.
        run: pip install -e "." pytest pyyaml

      - name: Run tests
        run: python -m pytest tests/ -q
