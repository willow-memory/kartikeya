name: Release

# Publishes to PyPI when a version tag is pushed (e.g. `git tag v0.0.1 && git push --tags`).
#
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored in the repo.
# One-time setup before the first release:
#   1. On PyPI: create the `kartikeya` project's trusted publisher — repo
#      rudi193-cmd/kartikeya, workflow `release.yml`, environment `pypi`.
#      (For the very first upload, use "pending publisher" on PyPI so the name
#      is claimed by this workflow.)
#   2. Create a GitHub environment named `pypi` (Settings -> Environments).
# Until that is configured, this workflow is inert — nothing publishes without a tag.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
