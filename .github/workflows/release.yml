name: Release

# Publishes to PyPI when a version tag is pushed (e.g. `git tag v0.0.1 && git push --tags`).
#
# Auth: a PyPI API token stored as the repo Actions secret `PYPI_API_TOKEN`
# (Settings -> Secrets and variables -> Actions). One-time setup: create the
# token on PyPI and add that secret. Until it exists, the publish step fails.
# (Trusted Publishing / OIDC is the tokenless alternative but this project uses
# the token pattern for parity with the operator's other releases.)

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false   # attestations require OIDC/Trusted Publishing
