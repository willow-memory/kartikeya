name: Release

# Publishes to PyPI when a version tag is pushed (e.g. `git tag v0.0.1 && git push --tags`).
#
# Auth: a PyPI API token stored as the repo Actions secret `PYPI_API_TOKEN`
# (Settings -> Secrets and variables -> Actions). One-time setup: create the
# token on PyPI and add that secret. Until it exists, the publish step fails.
# (Trusted Publishing / OIDC is the tokenless alternative. This repo is the odd
# one out now — willow-mcp moved to OIDC — so the two should be unified; until
# that decision lands, the token pattern here is left as-is deliberately.)

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from the git tag, so the tags must be
          # present. The default shallow checkout fetches none of them and the
          # build would silently produce 0.0.0.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Assert the tag matches the built version
        # The guard that was missing for v0.0.8: that tag was cut on a commit
        # whose pyproject still read 0.0.7, the build produced kartikeya-0.0.7,
        # and the mismatch was caught only by PyPI refusing a duplicate upload.
        # Fail here instead, where the message says what is actually wrong.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built="$(ls dist/*.tar.gz | sed -E 's|.*/kartikeya-(.+)\.tar\.gz|\1|')"
          echo "tag=${tag}  built=${built}"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag v${tag} builds version ${built} — refusing to publish"
            exit 1
          fi

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false   # attestations require OIDC/Trusted Publishing
