[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "kartikeya"
# The git tag is the single source of truth for the version — see
# [tool.hatch.version] below. A hardcoded version here is what broke the v0.0.8
# release: the tag was cut on a commit still reading 0.0.7, so the build produced
# kartikeya-0.0.7 and PyPI rejected it as a duplicate. A tag can no longer
# disagree with the artifact it builds.
dynamic = ["version"]
description = "Kartikeya — a standalone bubblewrap-sandboxed task queue and worker. Backend-agnostic (SQLite or Postgres); the execution engine formerly known as Kart."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Sean Campbell" }]
requires-python = ">=3.11"
keywords = ["task-queue", "sandbox", "bubblewrap", "bwrap", "worker", "kart", "willow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
# LLM-backed "workflow" task type. Base worker runs shell tasks with zero LLM deps.
llm = []
# Reference Postgres backend helpers (SQLite backend needs no extra).
postgres = ["psycopg2-binary>=2.9,<3.0"]

[project.scripts]
kartikeya = "kartikeya.worker:main"
kart = "kartikeya.worker:main"

[project.urls]
Homepage = "https://github.com/willow-memory/kartikeya"
Repository = "https://github.com/willow-memory/kartikeya"
Issues = "https://github.com/willow-memory/kartikeya/issues"

[tool.hatch.version]
# Derived from the git tag (hatch-vcs). At an exact tag `vX.Y.Z` the version is
# X.Y.Z; off-tag builds get a `.devN+g<sha>` suffix, which PyPI will not accept —
# so an accidental publish from an untagged commit fails loudly instead of
# shipping something mislabelled. CI must check out with `fetch-depth: 0`, or no
# tags are present and the derived version is wrong.
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/kartikeya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
