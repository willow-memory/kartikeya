[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kartikeya"
version = "0.0.2"
description = "Kartikeya — a standalone bubblewrap-sandboxed task queue and worker. Backend-agnostic (SQLite or Postgres); the execution engine formerly known as Kart."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sean Campbell" }]
requires-python = ">=3.11"
keywords = ["task-queue", "sandbox", "bubblewrap", "bwrap", "worker", "kart", "willow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
# LLM-backed "workflow" task type. Base worker runs shell tasks with zero LLM deps.
llm = []
# Reference Postgres backend helpers (SQLite backend needs no extra).
postgres = ["psycopg2-binary>=2.9,<3.0"]

[project.scripts]
kartikeya = "kartikeya.worker:main"
kart = "kartikeya.worker:main"

[project.urls]
Homepage = "https://github.com/rudi193-cmd/kartikeya"
Repository = "https://github.com/rudi193-cmd/kartikeya"
Issues = "https://github.com/rudi193-cmd/kartikeya/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kartikeya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
